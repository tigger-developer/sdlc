            GATE: implementation
            REVISION: W014 candidate (production-delta.patch cd3e815b plus RT014.5 response-isolation remediation; recovery.go 42048da1)

            VERDICT: PASS

            Delta since the prior round: recovery.go now truncates the CLI-owned temporary response file before every attempt, help.md documents the clearing, and the new fallback_output_test.go (RT014.5) verifies a failed primary's stale verdict cannot become the fallback's output. The prior verdict-accepting defect is resolved with the correct, minimal mechanism: truncation before each launch, fail-closed via the existing response-empty incident.

            Verified: RT014.5 uses a real process double where the primary writes a plausible PASS then exits nonzero and the fallback writes nothing; the harness must reject the empty response and emit no stdout verdict, which the test asserts. The truncation is unconditional per attempt, so it also covers same-adapter primary/fallback configurations, not just cross-harness ones. Evidence-integrity checks remain before invocation and are not bypassed. work.org's RT014.5 definition and validation.org's RED/GREEN record cover the new test without duplicating audit state.

            Installer Trash replacement, companion deployer coverage, and the fallback-eligibility/budget/provenance behaviour previously reviewed are unchanged and remain conformant to the recorded operator-authorized scope. Pending operator host validation of live Trash recovery remains closure evidence, not a gate condition.
