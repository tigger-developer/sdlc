        GATE: definition
        REVISION: W014 current candidate (production-delta.patch sha256 cd3e815b...eda4, evidence manifest as supplied)
        VERDICT: PASS

        Findings and assessment:

        Retrospective review of W014 (installer Trash replacement plus the operator-authorized audit-fallback emergency follow-up), per the recorded BYPASS-GATE-7 scope in docs/work.org.

        Requirements and traceability
        - AC014.1–014.3 map to RT014.1–014.3, implemented in internal/installer/trash_test.go and the companion deployer regression pack; observable outcomes asserted (recovered bytes in the double's recovery tree, no adjacent .bak for managed paths, one exact .bak for configuration, idempotence, symlink-target preservation).
        - AC014.4/014.5 map to RT014.4/RT014.5, implemented in fallback_test.go and fallback_output_test.go. Coverage spans limit, launch-error, timeout, malformed, wrong-gate, empty, all three valid verdicts, failed fallback, exhausted rounds, changed evidence, retained-fallback resume, and the stale-response-file isolation case. These exercise the real process boundary with local doubles and assert calls, audit-record history, provenance tuple and output — behavioural, not source-text tests. No metered provider in automated tests, consistent with TESTING.md.
        - Emergency backfill is present: work.org W014 entry, validation.org with RED/GREEN evidence and boundaries, operator validation correctly left Pending (closure concern, not this gate).

        Design and architecture fit
        - trash.go is a bounded, literal `trash ABSOLUTE_PATH` invocation with timeout, WaitDelay, combined-output error context, and a post-condition Lstat that the original path is gone — satisfying AC014.2's "dishonest trash" case. No shell evaluation, no widened permissions.
        - Configuration classification is clean: applyConfigurationChange retains the adjacent .bak and restore-on-failure path; trash is used only for owned files, directories, links and retirements. Init archives untouched, per scope.
        - The fallback delta reuses the existing AgentConfig fallback tuple with no new configuration surface, no provider-message catalogue, and no permission changes. fallbackEligible correctly excludes configuration-invalid and capability-unsupported; local evidence/record errors are untyped and never reach the recovery decision, satisfying AC014.5. The wrong-gate mismatch is now a typed incident; the result file is truncated before every attempt so a failed primary's bytes cannot become a fallback verdict; timeouts on the fallback itself still report the bounded diagnostic. Shared round budget and once-per-call fallback are enforced and tested.
        - Error propagation in synchronizeFile reads source bytes before trashing the destination (verified by TestMissingSourceDoesNotTrashDestination). Batch stop without rollback of prior items is an explicitly recorded, recoverable-through-Trash compromise with its consequence stated in the work record.

        Proportionality
        - No scope expansion beyond the operator-authorized change; no template inflation; the duplicated trashArtifact across the two repositories is a consequence of separate module boundaries, not an unnecessary abstraction. Nothing added merely to fill template sections.

        Audit-state hygiene
        - work.org and validation.org reference audits.yaml by link only; no duplicated verdicts, revisions, rounds or session IDs. No annotation records present; no feedback.yaml supplied. Nothing to fail on.

        Optional note (non-blocking): the operator validation entry in validation.org remains Pending; that is a closure prerequisite under TESTING.md, not a definition-gate condition.
