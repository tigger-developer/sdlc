        GATE: implementation
        REVISION: W014 candidate (production-delta.patch cd3e815b, covering installer Trash replacement and audit-harness unusable-result fallback)

        VERDICT: PASS

        Reviewed implemented tests first, then the production delta, against the recorded W014 operator-authorized scope (trash for replaced owned artefacts, adjacent .bak for shared configuration, no initializer archive changes) and the emergency follow-up scope (single fallback for audit attempts ending without a usable verdict).

        Tests
        - RT014.1–RT014.3 (internal/installer/trash_test.go): recoverability via a command double moving exact paths to a disposable tree, no adjacent .bak for managed artefacts, adjacent backup retained for configuration merges, missing-source and missing/failing/no-move trash all stop replacement. Coverage matches AC014.1–AC014.3 and uses a real process boundary without host Trash.
        - Companion deployer regression (tests/regression/trash_test.go, agents_deploy_test.go): drift replacement trashed with prior bytes recoverable, configuration backup asserted, failure modes stop deployment, idempotence and destination-only preservation retained.
        - RT014.4 (cmd/sdlc-harness/fallback_test.go): mode matrix covers usage limit, launch error, timeout, malformed, wrong-gate, empty, all three valid verdicts, failed fallback, exhausted rounds, changed evidence, and retained-fallback resume; asserts actual calls, round accounting, provenance tuple, primary incident retention, and no verdict emitted on blocked paths. No metered provider involved.
        - Existing installer integration and timeout/recovery tests were correctly adjusted for the new cache/fallback semantics rather than weakened; the mutation probe still verifies evidence-change rejection.

        Production
        - trash.go / deploy.go trashArtifact: literal exec.CommandContext("trash", absolute) with 30s timeout, WaitDelay, CombinedOutput in the error, and a post-Lstat absence check — safe exact-path invocation, no shell evaluation, honest-failure stop. applyInstallation pre-checks LookPath("trash") before any mutation. synchronizeFile reads source bytes before trashing the destination, so a read failure cannot displace the installed file.
        - Configuration changes retain the separate backupConfiguration/restore path; classification (configuration vs managed artefact) is explicit in plan steps on both installers. Init has no adjacent-.bak path, consistent with the stated no-archive-change boundary.
        - recovery.go: fallbackEligible admits authentication failures everywhere (auth-only fallback for non-audit phases) and, for audits, typed provider incidents excluding configuration-invalid and capability-unsupported; local evidence/record errors are untyped and stop. Wrong-gate and response-missing are now typed incidents, so they qualify. fallbackUsed bounds fallback to once per command; the shared round budget is enforced at loop top; retained fallback resume is guarded by the owns() tuple check; timeout diagnostics are reported only when no unused fallback remains. This matches AC014.4/AC014.5 and the operator's confirmed verdict set (PASS/FAIL/PROVISIONAL PASS never trigger fallback; running attempts are not failed attempts).

        Traceability, RED/GREEN evidence, and boundaries are recorded in validation.org without duplicating audit state; work.org carries only scope and acceptance criteria. No unauthorized scope or unjustified complexity found in the delta.

        Note (non-blocking, recorded already in validation.org): operator host validation of live Trash recovery remains pending; that is closure evidence, not an implementation-gate condition.
