        Prior finding resolution:

        FINDING 1 (missing retained coverage of the recovery fences) — RESOLVED. TestRecoveryStopsAfterConcurrentReset in reset_recovery_test.go exercises both boundaries the finding named:

        - Provider-return boundary: the mid-flight reset fires through the existing Request.OnResponse hook during provider execution; the provider double then returns an unusable response, the deferred attempt checkpoint fails the generation fence, and the joined ErrAuditReset returns before incident handling. Assertions confirm exactly one provider call, no verdict, unchanged reset bytes, and a zero cooldown deadline — proving the error bypassed cooldown recording, fallback and retry.
        - Failure-reload boundary: the reset fires through the diagnostics writer at the "Unusable provider response" checkpoint; the coordinator's record reload rejects the generation change instead of adopting the reset entry. Assertions confirm exactly one provider call, no verdict, and unchanged reset bytes.

        The test uses only existing production hooks (OnResponse/OnSession, the diagnostics writer, the real Hermes adapter against a local PATH double) — no test-only production interface was added, consistent with the recorded claim. The sensitivity check (baseline coordinator substitution failing both cases with an extra provider request and an internal lockout) is honestly recorded in validation.org as a retrospective check on initially GREEN preservation tests, which TESTING.md permits without artificial RED. RT020.1's "Recovery check" clause now has retained automated coverage in the specified retention target (go test ./cmd/sdlc-harness). The narrow #nosec G306 suppression names the rule with an adjacent justification and complies with CODING.md.

