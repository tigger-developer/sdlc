            FINDING 1 (blocking — traceability/coverage against the recorded scope)

            spec.org RT020.1 records a "Recovery check" — "Verify obsolete-generation errors bypass retry and that refreshed failure state is rejected when its generation differs" — with Retention "go test ./cmd/sdlc-harness", and AC020.2 forbids an earlier invocation adopting "the new generation for provider retries". The implemented suite covers the second clause at the attempt-persistence layer (reset_running_test.go rejects recordIdentity, finish and verdict writes on generation mismatch, and admits a fresh attempt), but nothing exercises the recovery coordinator's new fence branches in recovery.go:

            - the errors.Is(err, harness.ErrAuditReset) early return in execute() that bypasses incident handling, fallback and retry;
            - the saved.Generation != entry.Generation comparison on the post-failure record reload, which prevents an old invocation adopting a freshly reset entry and retrying on it.

            Baseline tests cannot reach these new branches (Generation and ErrAuditReset are introduced by this delta), so the only verification is the one-off OT020.1 control-flow review, while the spec records this check as retained automated RT coverage. A future refactor that adopts a reset entry after a provider failure would pass the entire retained suite while reintroducing the exact defect this change was authorized to fix.

            Required remediation: add a focused regression test to the retained suite (the existing local fake-harness doubles in package main are sufficient) verifying (a) an invocation fenced by a mid-flight reset returns the obsolete-generation error without fallback or retry, and (b) after a provider failure and a concurrent reset, the record reload rejects the generation change instead of adopting the reset entry; record the new execution evidence under RT020.1 in validation.org and resubmit. Alternatively, obtain an explicit operator decision to reclassify that clause to OT-only coverage and correct the RT020.1 definition with the specific justification recorded; urgency, difficulty or inconvenience is insufficient under EMERGENCY.md and TESTING.md.

            Checked and not blocking:

            - RT020.1's Method and Expected clauses are fully implemented (running reset with and without native identity, stale-write rejection without byte changes, history/findings survival, no-op repetition, other-gate budgets, missing/invalid invocation errors), as is all of RT020.2 (stale snapshots, two project roots, symlink alias fencing, 32 goroutines, 16 independent processes, race suite). RED records are honest, including the retrospective baseline-reproduction disclosure.
            - Production delta conforms to the approved design: generation semantics with explicit overflow failure, idempotent repeated reset, short flock transactions with alias resolution (O_NOFOLLOW, 0600 lock files, 0700 self-ignored .audit-locks/), provider execution outside the lock, legacy migration sharing the lock, no process search or termination.
            - No unauthorized scope or unjustified complexity; no new dependencies, signals or widened access.
            - spec.org and validation.org contain no duplicated audit findings, status, revisions, round numbers or session IDs (links to audits.yaml only).
            - Changed documentation (help.md, src/HARNESS.md, src/AUDITS.md, docs/ARCHITECTURE.md, CHANGELOG.md, LEARNINGS.md) is accurate against the delivered behaviour, frontmatter-compliant where required, and impersonal in voice.

            Advisory (non-blocking, pre-existing, outside this delta): the lock serializes each write transaction but not the read-running-check-to-begin window, so two concurrent harness processes can still both start audits for the same entry; unchanged from baseline and not claimed by the approved scope.
