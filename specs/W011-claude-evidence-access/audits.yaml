        ## What the delta does, verified against the code

        - **`claude_permissions.go`** projects `[]EvidenceFile` into `--settings` JSON with `permissions.allow` = exact `Read(//abs/path)` rules, emitting both the supplied path and `EvalSymlinks` target, deduplicated via `seen`.
        - **`runner.go:236-240` / `runner.go:262-266`** call the same helper on start and resume; `--tools Read` and `--permission-mode plan` are untouched, and no other provider branch changed.
        - **`main.go:223`** passes `evidence.Files` into `Request`; **`main.go:226-232`** builds the invocation *before* `beginAuditAttempt` (line 238), so an invalid path fails without consuming round budget or invoking the provider — AC011.2's "rejected before provider invocation" holds structurally.
        - **Escaping** is correct for gitignore semantics: backslash escaped first in the `Replacer` (single non-overlapping pass, no double-processing), `*?[]{}` escaped, trailing spaces escaped as `\ `. Leading `!`/`#` cannot occur because every rule starts with `/`.
        - **ARCHITECTURE.md:115-119** describes exactly this behaviour and names the limitation ("not a complete filesystem sandbox"). Accurate against the code.

        ## Test quality

        RT011.1 and RT011.2 are real behavioural tests at defensible boundaries — the public `BuildStart`/`BuildResume` contract, and the CLI `run()` entry point against a local `/bin/sh` fixture. Neither invokes a metered provider. RT011.1 asserts the settings object contains **only** `permissions.allow`, that `--tools Read` and `--permission-mode plan` survive, and that `--add-dir`/`--dangerously-skip-permissions` are **absent** — that is genuine evidence for AC011.2's "no directory or write permissions", not an implementation-detail assertion. RT011.2 proves the same identity reaches the process on start (`--session-id`) and resume (`--resume`) and that the audit mapping is retained. The `#nosec G306` suppression is narrow, rule-named, and justified.

        ## Findings — bounded follow-up

        **F1. `--settings` is appended after the positional prompt; ordering is unverified.**
        In both `runner.go:235-240` and `261-266` the prompt is the last fixed argument and `--settings <json>` is appended after it. Nothing in the evidence establishes that the Claude CLI parses flags following a positional argument. If it does not, the grants are silently discarded and the change is inert.
        - **Remediation:** insert the settings pair **before** `request.Prompt` — safe under any parser — or cite the `claude --help`/documented behaviour that permits trailing flags. Re-run RT011.1, RT011.2 and OT011.1 after the change.

        **F2. `--settings` merge semantics are assumed, not established.**
        AC011.2 requires that grants "do not disable existing hooks or deny rules". The code emits a settings object containing *only* `permissions.allow`. If `--settings` **replaces** rather than layers over configured settings, existing deny rules and hooks are dropped for the invocation — the opposite of the stated security posture. RT011.1's assertion that the object has exactly one key confirms the emitted payload, not the provider's precedence rule.
        - **Remediation:** cite the documented precedence for `--settings`, or record the unverified assumption explicitly as an emergency limitation alongside the POSIX-only note in `spec.org`.

        **F3. The symlink-alias branch is not deterministically exercised.**
        Both RTs compute `canonical` at runtime and append the second grant **conditionally** (`claude_permissions_test.go:25-27`, `cmd/.../claude_permissions_test.go:52-54`). On a platform where `t.TempDir()` returns an unaliased path, the dual-grant assertion silently degrades to a single rule and the alias behaviour — the core of AC011.1 and the first listed edge case — goes untested. TESTING.md requires deterministic tests independent of the developer's environment.
        - **Remediation:** create a symlinked parent directory inside `t.TempDir()`, pass the aliased path, and assert **both** rules unconditionally.

        **F4. RT011.2 has no recorded RED.**
        `validation.org` records RED/GREEN for RT011.1 but only "Evidence" for RT011.2. TESTING.md requires the author to observe each automated RT fail for the intended reason.
        - **Remediation:** record RT011.2's RED reason, or state why it was not written test-first.

        **F5. OT011.1 remains PENDING and must be recorded against this revision.**
        Record the read report above in `validation.org`, including the causal limitation, attributed to this audit invocation. Per TESTING.md, if F1–F3 change the permission projection, this OT result is no longer current and must be repeated.

        ## Observations — no remediation required

        - `claudeEvidenceSettings` returns plain `fmt.Errorf` values while every other `BuildStart`/`BuildResume` rejection returns a typed `*Incident` with a stable `Kind`. Harmless at present (`main.go:226` fails before any attempt is recorded), but inconsistent with the module's established failure vocabulary.
        - `spec.org` Delivery Handoff claims documentation impact on "CLI help, changelog and learnings"; none of those files are in the manifest, so those claims are **unverified here**. Only `ARCHITECTURE.md` was supplied and it is accurate.
        - `claude_permissions.go:26` packs four rejection conditions into one line; splitting would aid the next maintainer. `spec.org` uses `Proved by ::` where the template uses `Proven by ::`.

        **No duplication defect:** neither `spec.org` nor `validation.org` contains audit findings, verdicts, revisions, round numbers, or session identifiers. The audit record remains solely `audits.yaml`.

        **Not audited, by instruction:** W010 filesystem sandboxing, the pre-existing runner/CLI architecture, other providers, and native Claude enforcement. POSIX-only projection is accepted as a declared emergency limitation.

        I edited no files and ran no commands.
