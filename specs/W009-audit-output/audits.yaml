      response: |-
        GATE: definition
        REVISION: 3775ba2 plus the supplied working-tree evidence
        VERDICT: PROVISIONAL PASS

        **Scope reviewed:** `specs/W009-audit-output/spec.org` and `validation.org` against `src/ISSUES.md`, `src/TESTING.md`, `src/CODING.md`, `docs/ARCHITECTURE.md`, `.sdlc/project.yaml`, with `runner.go`, `session_output.go`, `claude_output.go`, `main.go` and `help.md` read as as-built evidence only. All manifest files read in full.

        **Audit-state check:** No findings, verdicts, statuses, round numbers or session IDs appear in either artefact. `validation.org`'s `Tested revision :: 3775ba2` is the one-off test's revision required by `TESTING.md`, not an audit record, and the `audits.yaml` reference is a link rather than a copy. No FAIL on that ground.

        **Fidelity:** AC009.1/.2/.3 track the recorded operator intent (progress visibility, surviving failure diagnostics, uncontaminated final-response stdout) without inventing scope. Claude `stream-json --verbose`, the 16 MiB capture bound with an explicit `output-limit` incident, the 4 KiB diagnostic cap and error-envelope rejection are consequences of that authorized change, not new behaviour. Security section correctly refuses to widen tools, model or configuration and is honest that provider error text may itself carry data. Design matches the architecture output-contract paragraph and the harness help.

        **Test definitions:** RT009.1–RT009.3 are behavioural, exercised through `Execute` with local executors and fixtures, deterministic, and explicitly excluded from metered regression. No test asserts source text. RT009.3's assertion on Claude's argument vector is accepted: that vector is the external provider contract, not an internal detail.

        Bounded, reversible follow-up (none of it invalidates definition sign-off or requires a behaviour or design decision):

        - **Finding 1 — OT is untraced in the specification.** `spec.org` defines only RTs and its summary says `live provider qualification is separate`, yet `validation.org` records executed OT009.1 - Live failed-provider diagnostic visibility as covering AC009.1 and AC009.2. Either define OT009.1 in the spec's Test Definitions with its bounds and add it to the relevant `Proved by` lines, or downgrade the `validation.org` claim to supporting evidence and correct the stale `Next step`. Documentary correction; pick one and make the two artefacts agree.
        - **Finding 2 — two stated conditions have no named proof.** AC009.3's clause that streaming retains *existing timeout behaviour*, and the edge case that *progress or a result received before process termination does not cancel the deadline or establish PASS*, are not named in any RT. RT009.2 covers timeout only for diagnostic survival. Extend RT009.3's definition (or add one RT) to name a mid-stream result followed by non-zero exit or deadline expiry yielding no result.
        - **Finding 3 — diagnostic bound is under-described.** Solution Design says diagnostics are *capped to 4 KiB*; the implemented and documented behaviour retains a 4 KiB **tail** for plain-text failure output, discarding earlier text. `help.md` states this; the spec should, since which end is dropped is the operationally relevant fact.
        - **Observation, no action required unless inaccurate:** the 30-second liveness heartbeat is documented in `help.md` but is absent from both the Changes and Unchanged boundaries. If it predates this change, listing it under Unchanged would close the ambiguity for a later reader.
