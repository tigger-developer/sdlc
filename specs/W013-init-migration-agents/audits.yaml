        GATE: implementation
        REVISION: working tree per evidence manifest, 2026-09-12 (projectinit.go 41ff75bd)

        VERDICT: PASS

        Reviewed implemented tests first, then production code, against the W013 spec, operator-authorized emergency scope, and CODING/TESTING/GO standards.

        Tests (migration_agent_test.go, plus named tests in projectinit_v3_test.go):
        - RT013.1 implemented and behavioural: exercises the real prepareLegacyProject coordinator with command doubles, asserts Hermes ticket migration (audit profile, model+provider) precedes Codex AC conversion (definition profile), with exact CLI arguments, cwd, stdin prompt, and provider applicability. Distinct models prove the profiles are selected independently.
        - RT013.2: failed ticket migration propagates the original error (errors.Is) and makes exactly one call; no conversion launched.
        - RT013.3: Claude receives --print/--permission-mode acceptEdits/--model with no provider and no read-only flags; missing Hermes provider fails before any process launch (calls == 0 asserted); unsupported harness handoff covered by TestW004UnsupportedMutationAdapterReturnsExactHandoff, including recovery-record pointers and no process launch.
        - RT013.4: repair tests cover canonical skip (no agent), single bounded repair invocation with the definition model, prompt carrying template path and the actual validation error, deterministic revalidation, and fail-closed rejection of invalid repair. TestRunMigratesV1ThroughTicketSkillBeforeCreatingProfile covers launch failure, resume offering ticket migration again (ticket-migration.org absent), single consolidation, and archive-branch preservation. Canonical ledger merges without an agent (deterministic MergeLegacyAcceptanceCriteria path retained).
        - No metered service enters the suite (localOnlyTestRunner guards Codex); the stale Hermes classification double now emits session_id on stderr, matching the native adapter contract.
        - validation.org records RED (Hermes refusal before any native command) and GREEN with scope limits; no audit findings, verdicts, or session identity duplicated into spec or validation records.

        Production code:
        - runConfiguredMutationSkill implements exactly the specified invocation contracts for codex/hermes/claude, prompt delivered literally via stdin (no shell interpolation; exec.Command with argument slice), project-local cwd, Hermes-only provider consumption with pre-launch validation, and the existing actionable handoff for unsupported harnesses. Routing prefixes (SDLC_AUDIT for ticket migration, SDLC_SPEC for conversion/repair) match the operator agreement; the comment correctly documents these as writing migrations, never audit invocations.
        - prepareLegacyProject stops on first failure with wrapped errors preserving causes; repairLegacyLedgerIfRequired revalidates after the agent and fails closed.
        - The resume path re-offers optional v1 ticket migration when the migration index is absent (chooseTicketMigration runs for resumed v1 sources), matching AC013.3.
        - Security: no widened access, no permission bypasses, no secrets in output, no new dependencies; changes are confined to the authorized areas.

        No findings requiring remediation. Bounded follow-up (does not affect sign-off): the operator's post-installation retry on the blocked project remains the live native integration check, as validation.org already records.
