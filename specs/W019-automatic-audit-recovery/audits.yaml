        ## Scope confirmation

        Emergency workflow accepted. The reconciled `spec.org` plus `validation.org` supply the operator-authorized scope; no advance definition gate applied. No audit state is duplicated in the specification, validation record or work ledger. RT019.1/RT019.2/OT019.1 are GREEN with recorded RED history; UT019.1 is explicitly AMBER with a reason, which is permitted here. Every regression provider is a local executable double; no metered service is embedded.

        The authorized contract is implemented and evidenced: automatic context selection, removal of public `--session`, gate-local verdict accounting, configurable consecutive-failure bound with persistent internal stop, format clarification in the retained context, immediate authentication fallback with terminal failure, authorized `--reset` clearing both counters while retaining history, and bounded private diagnostics. The findings below are the remaining defects.

        ## Findings and required remediation

        **1. `AUDITS.md` misstates delivered audit liveness output (blocking, stale required documentation)**

        `src/AUDITS.md:147-149` states: "While waiting, the harness emits a start message and 30-second liveness heartbeats to stderr." For audits this is no longer true. `cmd/sdlc-harness/main.go:289-300` routes the runner's diagnostics to `auditDiagnostics`, so `reportHeartbeat` (`internal/harness/runner.go:226-239`) writes both the start message and every 30-second tick to the private log. `cmd/sdlc-harness/diagnostics.go:60-64` echoes only the start line, as a single `Audit in progress.` The periodic ticks ("external context still running…") never reach the caller.

        Required: either correct the `AUDITS.md` passage (and align `HARNESS.md:124-126`) to describe the delivered contract — one `Audit in progress.` notice per attempt, with periodic liveness retained privately — or restore caller-visible periodic liveness without session identifiers. Do not leave the two in conflict.

        **2. Unlabelled legacy history is charged to an explicit gate (blocking, contradicts an approved decision)**

        `internal/harness/audit_record.go:66-68`: when `History` is empty, a usable top-level `Verdict` counts one round for whichever gate is selected, without any gate labelling. A legacy `gate: implementation` record with no history therefore consumes one of the five `delivery-code` (or `test-code`) verdicts. This contradicts the specification edge case ("Legacy unlabelled implementation rounds remain historical evidence, not invented test-code/delivery-code verdicts") and `HARNESS.md:174-175`. It is also internally inconsistent: once `beginAuditAttempt` migrates that entry into `History`, `roundGate` resolves it to `implementation` and the same evidence stops counting.

        Required: apply the same gate resolution to the no-history branch so unlabelled legacy evidence is not charged to an explicit gate, and cover the case in `internal/harness`.

        **3. Two regression cases no longer exercise their stated behaviour (blocking, delivered test package)**

        - `cmd/sdlc-harness/cooldown_test.go:70-72` passes `--session primary-session`. That flag no longer exists, so `run` fails during flag parsing; `blocked` is true for `resume-no-record`, the test returns at line 100, and the assertions at lines 109-114 ("passed primary session to fallback") are unreachable. The mode now proves only that an unknown flag is rejected. Since `main.go:113-115` makes `--audit-record` mandatory for every audit, the recordless-resume scenario is unreachable by design.
        - `cmd/sdlc-harness/reset_test.go:62` includes `"--session", "native"` in `TestResetSessionRejectsAmbiguousInvocation`. It now passes because of the undefined flag, not the reset-ambiguity rule it names. `TestW004StartRejectsSuppliedSession` already covers flag removal.

        Required: remove or re-express both cases against the current interface so each retains a single, reachable behavioural reason for failure.

        **4. Named edge case and acceptance-criterion output lack implemented coverage**

        - No test covers "Raised configuration limits do not clear a recorded internal stop" (`spec.org` Edge Cases). `FailureBlocked` implements it, but `automatic_test.go` only exercises a limit configured before the lockout. Add a case that locks out at the default, raises `max_failures`, and asserts the next audit is still refused without a provider call.
        - No test asserts the caller-facing `Diagnostic reference:` line required by AC019.5 ("returns human intervention required *and* a diagnostic reference"). `main.go:249-256` and `main.go:301-305` emit it; `automatic_test.go` verifies only the log contents and the absence of internal state. Add the positive assertion.

        **5. Two caller-facing statements do not match delivered behaviour (correct with the above)**

        - `src/HARNESS.md:192-193`: "Further **uncached** audits are refused until an authorized `--reset`." An internal stop refuses cached requests too: `main.go:249-257` returns before the cache lookup, and `cache.go:35` declines while `FailureBlocked()`. Remove "uncached" or state that the lockout precedes cache lookup.
        - `cmd/sdlc-harness/main.go:69`: `unknown operation %q; use start, resume or goal-config` advertises only the transitional words and omits the normal no-operation form that `help.md` and `HARNESS.md:66-71` document. Help text is documentation under `DOCUMENTATION.md`; state the normal invocation and keep `start`/`resume` as accepted legacy words.
        - Related, lower materiality: `HARNESS.md:124` says stdout contains only a validated audit response or readiness report, while `main.go:130` writes the `AUDIT BUDGET RESET:` confirmation to stdout. Reconcile the sentence with the reset operation.

        ## Advisory, not blocking

        - `run` (`main.go:44-313`, ~270 lines) and `recoveryRun.execute` (`recovery.go:32-154`, ~120 lines with a four-level nest) both exceed `CODING.md`'s 50-line and three-level review tripwires with no recorded justification. The specification approves a single recovery coordinator, so this is decomposition within the approved structure, not a redesign.
        - `diagnostics.go:48-66` returns the full input length after truncating at the 16 MiB cap. The behaviour is intentional and bounded, but the deviation from the `io.Writer` contract deserves an adjacent comment.
        - `fallback_test.go:21` still sets `SDLC_HARNESS_STATE_DIR`, which `HARNESS.md:294-296` records as no longer used. Harmless isolation; remove when convenient.
        - `src/config/project-init.schema.yaml` defines `SDLC_AUDIT_MAX_ROUNDS` but no `max_failures` field. The specification does not require an initializer question for it, and resolution works from global or project YAML, so this is an option, not a defect.
        - `docs/work.org:16` still names `audits.org` as the evidence authority. Pre-existing staleness, not introduced by this delta.

        Re-audit after remediating findings 1 through 5; address them as one batch and challenge any finding you consider out of scope with evidence.
