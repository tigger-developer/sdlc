        GATE: implementation
        REVISION: W015 emergency delta (change.patch 549cd150, request.md 65972452)
        VERDICT: PASS

        Findings: none blocking.

        Basis:

        - Scope and authority: Workflow emergency, BYPASS-GATE-7, request.md is the durable operator-authorized record; no advance definition demanded. Delta (change.patch) matches the supplied files; no installer cleanup or unrelated harness changes present, matching the operator's withdrawn portion.

        - AC015.1 (reset-only CLI): the --reset-session branch in run() executes before ResolveConfig, stdin read, prompt registry load, evidence capture and temp-file creation; it validates action/phase/gate/record/work-item, rejects --session and --input, then exits with a single stdout line. Gate validity (definition|implementation) is enforced by the earlier audit-phase check. Relative record paths resolve against --project per help.md.

        - AC015.2 (preserve evidence): ResetAuditBudget appends {after_round, updated} via the existing atomic writer; SessionID, History, Findings, ExternalRound, cache keys and other gates are untouched (RT015.1 asserts byte-identical repeated reset, which the RoundsUsed()==0 early return guarantees). Exhausted status transitions to active, or identity-missing when no native ID — matching "reset does not repair a missing native identity".

        - AC015.3 (retain bounds): all four admission/exhaustion/reporting points (main resume check, recovery loop guard, invoke status update, reportTimeout remaining) now use the shared RoundsUsed() = external_round − last reset boundary; legacy records with no boundary keep prior semantics. RT015.3 verifies two post-reset attempts then a fifth-call rejection with four histories retained; RT015.4 verifies fallback after reset consumes the new allowance with lifetime numbering continuing past the prior five.

        - Test quality: reset_test, timeout_test and fallback_test cover happy, no-op, repeated, missing-record, running, ambiguous-invocation and cross-gate isolation paths, all asserting record bytes or structured state; doubles are local shell scripts with no metered providers, satisfying TESTING.md and the operator's constraint. Structural review: the reset path adds no new subsystem, dependency, permission or concurrency mechanism (running state is simply rejected), consistent with request.md's explicit non-goal.

        - Traceability: RT015.1–RT015.4 map to the implemented tests via request.md; test function names are behavioural. RED evidence for the absent flag is recorded in the ticket as TDD evidence, not duplicated audit state — no audits.yaml duplication finding.

        - One non-blocking observation: reset_test.go does not cite the RT015 identifiers adjacent to the test functions (fallback_test cites RT014.4). Testing.md's adjacent-descriptor rule applies to cited identifiers, so this is a consistency nit, not a violation; no action required for sign-off.
