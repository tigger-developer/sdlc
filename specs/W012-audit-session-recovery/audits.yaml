      response: |-
        GATE: implementation
        REVISION: sha256:5020c015cca327bfa43cd1022f8493a2a2addac301a84bef60f6fcb19fa39335
        VERDICT: PROVISIONAL PASS

        ## Basis

        Reviewed the full patch, the ten changed source files, the implemented one-off checks, the adjacent regression tests the patch touched (`runner_test.go`, `output_test.go`), and W012 `spec.org`/`validation.org` against AUDITS, TESTING, CODING and GO.

        **No duplication trigger.** `spec.org` links to `audits.yaml` and carries no verdict, round or session state. `validation.org` records OT results, which TESTING.md mandates; its "round 3" reference belongs to a throwaway probe record, not this work item's audit state. No FAIL on that ground.

        **Behaviour verified as correct** in the focus areas: cache identity is computed pre-admission and excludes execution limits only (`main.go:176-190`, `cache.go:13-49`); incidents, keyless legacy rounds, `running` entries and verdict/response disagreement are all excluded from reuse; every attempt increments `ExternalRound` and replacements re-check the budget at loop top (`recovery.go:42-43`); retired identity, tuple and reason are preserved (`recovery.go:100-106`); evidence is hash-verified on capture, before transport, and before and after execution, including on a cache hit; fallback is bounded to one missing-session restart plus one authentication fallback and cannot be re-entered once sticky (`recovery.go:39, 81-91`); Hermes identity now comes only from native stderr, never from model-written text.

        ## Conditions

        **1. Stale Hermes assertions pin abandoned production branches.** `Execute` no longer routes Hermes through `ParseResult` (`internal/harness/runner.go:171-186`), yet three retained regression tests still assert the old model-written stdout envelope:

        - `internal/harness/runner_test.go:112` — `TestW004ParseNativeFinalResponses` hermes case
        - `internal/harness/runner_test.go:134` — `TestW004RunnerRejectsInvalidOutcomes` hermes case
        - `internal/harness/runner_test.go:262` — `TestW004HermesRequiresNativeSessionEnvelope`

        They keep `ParseResult`'s `hermes` case (`runner.go:364-375`), `nativeIdentity`'s `hermes` case (`session_output.go:192-195`) and the `SESSION_ID:` guard in `report()` (`session_output.go:122`) alive as unreachable code that contradicts the contract help.md now documents. The patch updated the matrix executors and `timeout_test.go` for exactly this and missed these three.

        **Remedy:** delete the dead branches and the three assertions, or repoint them at the stderr contract. No new tests required — `TestW004FixedStartAndResumeInvocations`, `TestW004ExecuteStartAndResumeAcrossHarnesses`, `TestW009SplitIdentityCheckpointsExactlyOnce` and `TestTimeoutRetainsOnlyNativeIdentity` already cover the new path.

        **2. AC012.4 is unproven.** OT012.3 is `PENDING` by deliberate sequencing. Run the one authorized `make install`, check installed release/help and binary identity, and record the observed result.

        **3. `validation.org` completed entries are incomplete under TESTING.md.** A completed entry must carry the tested revision and relevant environment. OT012.1, OT012.2 and OT012.4 give none; OT012.2 and OT012.4 also name no tester. Backfill revision and environment.

        ## Non-blocking observations

        - **Fallback misclassification tail risk:** on non-zero exit, `providerFailure` scans `diagnostics.tail + failureText + plainFailure` (`runner.go:146`). For Hermes, non-JSON model prose reaches `plainFailure`, so a response line starting "Not logged in" or "Authentication failed" could select one spurious fallback. Bounded to one attempt, one round, with recorded provenance. Worth narrowing to stderr for Hermes later.
        - **Inline transport exposure:** Hermes now receives full evidence text up to the 64 MiB evidence ceiling in one stdin prompt, filtered only by the `.env` guard. Authorized by the spec and documented; caller responsibility for a Hermes-configured phase. W010 covers the broader sandboxing.
        - **`run()` remains ~190 lines** against the 50-line tripwire in CODING.md and GO.md, though the delta cut roughly 70 lines from it by extracting `recoveryRun`. Direction of travel is right; not a blocker.
        - **Coverage gap, low value:** no implemented check that a timeout or a FAIL verdict declines fallback. The `switch` in `recovery.go:81-91` matches only two incident kinds, so the evidence is structural. Not requesting a test.
