version: 3

precedence:
  - cli
  - environment
  - project
  - global
  - default

retired_environment_keys:
  - SDLC_PROJECT_TYPE
  - SDLC_INFRA_ENABLED
  - SDLC_REVISION
  - SDLC_REQUIREMENT_AUTHORITIES

technology_detection:
  exclude_directories:
    - .agent
    - .agents
    - .claude
    - .codex
    - .git
    - .specify
    - build
    - dist
    - node_modules
    - vendor
  exclude_prefixes:
    - docs/archive/
  rules:
    - technology: API
      basenames: [openapi.json, openapi.yaml, openapi.yml, swagger.json, swagger.yaml, swagger.yml]
    - technology: FISH
      extensions: [.fish]
    - technology: GO
      basenames: [go.mod, go.work]
      extensions: [.go]
    - technology: HUGO
      basenames: [hugo.json, hugo.toml, hugo.yaml, hugo.yml]
      implies: [WEB]
    - technology: JAVASCRIPT
      extensions: [.cjs, .js, .jsx, .mjs, .ts, .tsx]
    - technology: LUA
      basenames: [.luacheckrc, .stylua.toml]
      extensions: [.lua, .rockspec]
    - technology: NODE
      basenames: [bun.lock, bun.lockb, deno.json, deno.jsonc, package-lock.json, package.json, pnpm-lock.yaml, yarn.lock]
    - technology: PERL
      extensions: [.pl, .pm, .t]
    - technology: PYTHON
      basenames: [Pipfile, poetry.lock, pyproject.toml, requirements.txt, uv.lock]
      extensions: [.py]
    - technology: RUST
      basenames: [Cargo.lock, Cargo.toml]
      extensions: [.rs]
    - technology: SHELL
      extensions: [.bash, .sh]
    - technology: SWIFT
      basenames: [Package.swift]
      extensions: [.swift]
    - technology: WEB
      extensions: [.css, .htm, .html, .scss]

fields:
  - key: SDLC_PROJECT_KIND
    path: project.kind
    flag: project-kind
    help: Project role
    type: choice
    choices: [application, library, website, infrastructure, other]
    prompt: "Select project role:"
    allow_global: false
    required: true

  - key: SDLC_TECHNOLOGIES
    path: standards.technologies
    flag: technologies
    help: Comma-separated technology standards
    type: multi-choice
    choices_from: technologies
    prompt: "Select applicable technologies by number or name, separated by commas:"
    allow_global: false
    required: true

  - key: SDLC_PRODUCT_AUTHORITIES
    path: authorities.product
    flag: product-authorities
    help: Comma-separated product authority paths
    type: string-list
    prompt: "Product authority paths"
    phase: post-migration
    discovery_category: product
    allow_global: false

  - key: SDLC_ARCHITECTURE_AUTHORITIES
    path: authorities.architecture
    flag: architecture-authorities
    help: Comma-separated architecture authority paths
    type: string-list
    prompt: "Architecture authority paths"
    phase: post-migration
    discovery_category: architecture
    allow_global: false

  - key: SDLC_BRANCH_STRATEGY
    path: delivery.branch_strategy
    flag: branch-strategy
    help: Delivery branch strategy
    type: choice
    choices: [current, feature]
    prompt: "Select delivery branch strategy:"
    default: current
    allow_global: true

  - key: SDLC_SPEC_HARNESS
    path: delivery.definition.harness
    flag: spec-harness
    help: Definition agent harness
    type: choice
    choices: [codex]
    prompt: "Select definition harness:"
    default: codex
    allow_global: true
    migration_aliases: [SDLC_AGENT_HARNESS]

  - key: SDLC_SPEC_PROVIDER
    path: delivery.definition.provider
    flag: spec-provider
    help: Definition model provider
    type: choice
    choices: [openai]
    prompt: "Select definition provider:"
    default: openai
    allow_global: true
    migration_aliases: [SDLC_DELIVERY_PROVIDER]

  - key: SDLC_SPEC_MODEL
    path: delivery.definition.model
    flag: spec-model
    help: Definition model
    type: choice
    choices: &supported_openai_models [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
    prompt: "Select definition model:"
    default: gpt-5.6-sol
    allow_global: true
    migration_aliases: [SDLC_DELIVERY_MODEL]

  - key: SDLC_BUILD_HARNESS
    path: delivery.build.harness
    flag: build-harness
    help: Delivery agent harness
    type: choice
    choices: [codex]
    prompt: "Select delivery harness:"
    default: codex
    allow_global: true
    migration_aliases: [SDLC_AGENT_HARNESS]

  - key: SDLC_BUILD_PROVIDER
    path: delivery.build.provider
    flag: build-provider
    help: Delivery model provider
    type: choice
    choices: [openai]
    prompt: "Select delivery provider:"
    default: openai
    allow_global: true

  - key: SDLC_BUILD_MODEL
    path: delivery.build.model
    flag: build-model
    help: Delivery model
    type: choice
    choices: *supported_openai_models
    prompt: "Select delivery model:"
    default: gpt-5.6-terra
    allow_global: true

  - key: SDLC_AUDIT_HARNESS
    path: delivery.audit.harness
    flag: audit-harness
    help: External audit harness
    type: choice
    choices: [codex]
    prompt: "Select external audit harness:"
    default: codex
    allow_global: true
    migration_aliases: [SDLC_AGENT_HARNESS]

  - key: SDLC_AUDIT_PROVIDER
    path: delivery.audit.provider
    flag: audit-provider
    help: External audit model provider
    type: choice
    choices: [openai]
    prompt: "Select external audit provider:"
    default: openai
    allow_global: true

  - key: SDLC_AUDIT_MODEL
    path: delivery.audit.model
    flag: audit-model
    help: External audit model
    type: choice
    choices: *supported_openai_models
    prompt: "Select external audit model:"
    default: gpt-5.6-luna
    allow_global: true

  - key: SDLC_AUDIT_TIMEOUT
    path: delivery.audit.timeout
    flag: audit-timeout
    help: External audit timeout, such as 4m or 300s
    type: duration
    prompt: "External audit timeout:"
    default: 5m
    allow_global: true

  - key: SDLC_INFRA_ROLE
    path: infrastructure.role
    flag: infra-role
    help: Infrastructure relationship
    type: choice
    choices: [none, consumer, provider]
    prompt: "Select infrastructure role:"
    default: none
    allow_global: false
    required: true

  - key: SDLC_INFRA_OWNER
    path: infrastructure.owner
    flag: infra-owner
    help: Infrastructure owner descriptor
    type: string
    prompt: "Infrastructure owner, or blank for none:"
    allow_global: true
    migration_aliases: [SDLC_INFRA_PROVIDER]
    when:
      field: SDLC_INFRA_ROLE
      values: [consumer, provider]

  - key: SDLC_INFRA_CONTRACT
    path: infrastructure.contract
    flag: infra-contract
    help: Infrastructure integration contract
    type: string
    prompt: "Infrastructure contract path, or blank for none:"
    allow_global: true
    when:
      field: SDLC_INFRA_ROLE
      values: [consumer, provider]
